# Cloud overlay for the instance provisioned by infrastructure/observability.
#
# Applied with:
#   docker compose -f compose.yaml -f compose.cloud.yaml up -d
#
# It changes three things the local bundle deliberately gets wrong for a server:
#
#  1. Ports. Locally every service publishes on a high loopback port. Here each publishes on the
#     port the load balancer's backend expects, on all interfaces, because the only route to this
#     instance is the load balancer: it has no public address and one firewall rule admits Google's
#     health-check and proxy ranges. The collector also publishes its health endpoint, which the
#     OTLP backend service probes.
#  2. Durable storage. Locally the data lives in Docker named volumes on the container filesystem.
#     Here Prometheus, Loki and Tempo local state sit on the attached persistent disk, Loki chunks,
#     Tempo blocks and MLflow artefacts go to Cloud Storage, and MLflow metadata goes to Cloud SQL
#     through the Auth Proxy, so it is covered by the platform root's backups.
#  3. Secrets. The Grafana administrator password is read from Secret Manager by the instance
#     startup script into an environment file, never written into an image, this file or Terraform
#     state.

services:
  otel-gateway:
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"

  prometheus:
    volumes:
      - ${KRATOS_DATA_ROOT:?the cloud overlay needs KRATOS_DATA_ROOT}/prometheus:/prometheus
    ports: []

  loki:
    command:
      - -config.file=/etc/loki/loki-cloud.yaml
      # The bucket name reaches the config through the environment, so it stays in one place.
      - -config.expand-env=true
    volumes:
      - ./config/cloud/loki.yaml:/etc/loki/loki-cloud.yaml:ro
      - ${KRATOS_DATA_ROOT:?the cloud overlay needs KRATOS_DATA_ROOT}/loki:/loki
    environment:
      KRATOS_TELEMETRY_BUCKET: ${KRATOS_TELEMETRY_BUCKET:?the telemetry bucket must be named}
    ports: []

  tempo:
    command:
      - -config.file=/etc/tempo/tempo-cloud.yaml
      - -config.expand-env=true
      - -backend-scheduler.provider.work.compaction.block-retention=72h
    volumes:
      - ./config/cloud/tempo.yaml:/etc/tempo/tempo-cloud.yaml:ro
      - ${KRATOS_DATA_ROOT:?the cloud overlay needs KRATOS_DATA_ROOT}/tempo:/var/tempo
    environment:
      KRATOS_TELEMETRY_BUCKET: ${KRATOS_TELEMETRY_BUCKET:?the telemetry bucket must be named}
    ports: []

  grafana:
    environment:
      GF_SERVER_ROOT_URL: https://${KRATOS_GRAFANA_HOST:?the public Grafana host must be named}
      # Grafana already renders a sign-out button. Continue that action through IAP's cookie-clear
      # flow so it ends both the Grafana session and the outer dashboard session.
      GF_AUTH_SIGNOUT_REDIRECT_URL: https://${KRATOS_GRAFANA_HOST:?the public Grafana host must be named}/?gcp-iap-mode=CLEAR_LOGIN_COOKIE
      # Identity-Aware Proxy has already authenticated the request at the load balancer.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-Goog-Authenticated-User-Email
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
    volumes:
      - ${KRATOS_DATA_ROOT:?the cloud overlay needs KRATOS_DATA_ROOT}/grafana:/var/lib/grafana
    ports:
      - "3000:3000"

  mlflow:
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --workers=2
      - --backend-store-uri=${KRATOS_MLFLOW_DATABASE_URI:?the MLflow database URI must be supplied}
      - --artifacts-destination=gs://${KRATOS_TELEMETRY_BUCKET:?the telemetry bucket must be named}/mlflow
      - --serve-artifacts
      - --allowed-hosts=${KRATOS_MLFLOW_HOST:?the public MLflow host must be named},mlflow:5000
      - --cors-allowed-origins=https://${KRATOS_MLFLOW_HOST:?the public MLflow host must be named}
    volumes:
      # Holds the SQLite store when no Cloud SQL database is enabled; unused when one is.
      - ${KRATOS_DATA_ROOT:?the cloud overlay needs KRATOS_DATA_ROOT}/mlflow:/var/lib/mlflow
    ports: []

  # MLflow has no session UI because IAP owns authentication. This small edge proxy leaves every
  # MLflow API response untouched and adds one visible IAP sign-out control to HTML pages.
  mlflow-iap-edge:
    image: nginx:1.29.1-alpine@sha256:42a516af16b852e33b7682d5ef8acbd5d13fe08fecadc7ed98605ba5e3b26ab8
    restart: unless-stopped
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./config/mlflow-edge/nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
    networks: [edge]
    ports:
      - "5000:5000"
    mem_limit: 64m
    depends_on: [mlflow]
