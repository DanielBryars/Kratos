# Applied on top of compose.cloud.yaml only when a Cloud SQL database was provisioned, so the
# default closed database gate never references a proxy that does not exist. Without this overlay
# MLflow keeps its SQLite store on the persistent disk.
#
#   docker compose -f compose.yaml -f compose.cloud.yaml -f compose.cloudsql.yaml up -d

services:
  mlflow:
    depends_on:
      cloud-sql-proxy:
        condition: service_started

  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.2@sha256:fc224915ef435afeb5b2a9421260a0d31986d5c8b7c7f5783c7f5d5885700cd2
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # A fixed address on the dedicated metadata bridge is allowlisted by the host startup script.
    # The proxy can therefore mint its short-lived IAM database credential without exposing its
    # listener on the host or granting metadata access to the rest of the backend network.
    networks:
      backend: {}
      metadata:
        ipv4_address: 172.30.2.12
    command:
      - --address=0.0.0.0
      - --port=5432
      - --auto-iam-authn
      - ${KRATOS_MLFLOW_INSTANCE:?the Cloud SQL instance connection name must be supplied}
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
