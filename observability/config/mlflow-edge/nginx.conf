worker_processes 1;
pid /var/run/nginx.pid;

events {
  worker_connections 256;
}

http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  server {
    listen 5000;
    server_name _;
    resolver 127.0.0.11 valid=30s;

    location = /kratos-iap-signout.css {
      default_type text/css;
      return 200 '#kratos-iap-signout{position:fixed;z-index:2147483647;right:16px;bottom:16px;padding:9px 14px;border-radius:7px;background:#1f2937;color:#fff;font:600 14px/20px system-ui,sans-serif;text-decoration:none;box-shadow:0 2px 8px #0005}#kratos-iap-signout:hover{background:#111827}';
    }

    location / {
      set $mlflow_upstream http://mlflow:5000;
      proxy_pass $mlflow_upstream;
      proxy_http_version 1.1;
      # MLflow validates Host before serving even its health endpoint. Use the fixed Docker
      # service identity on the trusted hop; retain the browser-facing host below for URL context.
      proxy_set_header Host mlflow:5000;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Accept-Encoding "";

      # IAP consumes CLEAR_LOGIN_COOKIE before this request reaches nginx. The link therefore
      # works without a server-side session or another public endpoint.
      sub_filter_once on;
      sub_filter '</head>' '<link rel="stylesheet" href="/kratos-iap-signout.css"></head>';
      sub_filter '</body>' '<a id="kratos-iap-signout" href="/?gcp-iap-mode=CLEAR_LOGIN_COOKIE">Sign out</a></body>';
    }
  }
}
