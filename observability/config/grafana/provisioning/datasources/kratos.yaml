apiVersion: 1

# Provisioned datasources are read-only in the interface, so the running stack matches this file.
datasources:
  - name: Prometheus
    uid: kratos-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 30s

  - name: Loki
    uid: kratos-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      # A trace identifier in a log line links to the trace in Tempo.
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: kratos-tempo
          url: "$${__value.raw}"
          urlDisplayLabel: View trace

  - name: Tempo
    uid: kratos-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      # A span links to the logs of the same Kratos job.
      tracesToLogsV2:
        datasourceUid: kratos-loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceID: false
        customQuery: true
        query: '{service_name=~".+"} | kratos_job_id="$${__span.tags["kratos.job.id"]}"'
