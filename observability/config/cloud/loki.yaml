# Loki for the cloud instance: chunks and the index live in Cloud Storage, so the persistent disk
# holds only working state. Limits are identical to the local bundle; only storage differs.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    gcs:
      bucket_name: ${KRATOS_TELEMETRY_BUCKET}

schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: gcs
      schema: v13
      index:
        prefix: loki/index_
        period: 24h

storage_config:
  gcs:
    bucket_name: ${KRATOS_TELEMETRY_BUCKET}
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index-cache

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: gcs

limits_config:
  retention_period: 168h
  allow_structured_metadata: true
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  max_global_streams_per_user: 5000
  max_label_names_per_series: 15
  max_line_size: 16KB
  max_streams_per_user: 2000
  max_entries_limit_per_query: 5000
  per_stream_rate_limit: 512KB
  per_stream_rate_limit_burst: 2MB
  max_line_size_truncate: true
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes:
            - service.name
            - kratos.worker.id

analytics:
  reporting_enabled: false
