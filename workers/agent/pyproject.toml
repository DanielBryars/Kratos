[project]
name = "kratos-agent"
version = "0.1.0"
description = "Kratos GPU worker agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.1,<8",
    "pydantic>=2.11,<3",
]

[project.scripts]
kratos-agent = "kratos_agent.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["docker", "docker.*"]
ignore_missing_imports = true
