[project]
name = "kratos-soak-workload"
version = "0.1.0"
description = "Fixed-duration CUDA soak workload for Kratos"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.3.3",
    "torch==2.8.0",
]

[dependency-groups]
dev = [
    "mypy==1.18.2",
    "pytest==8.4.2",
    "ruff==0.13.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]

[[tool.mypy.overrides]]
module = "torch.*"
ignore_missing_imports = true
