[project]
name = "kratos-gpu-health-check"
version = "0.1.0"
description = "Controlled CUDA computation check for Kratos workers"
requires-python = ">=3.12"
dependencies = [
    "cupy-cuda12x>=13.6,<14",
]

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "cupy"
ignore_missing_imports = true
