name: Deploy development

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-development
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_enable_database: ${{ vars.GCP_ENABLE_DATABASE || 'false' }}

jobs:
  deploy:
    if: >-
      ${{ vars.GCP_TERRAFORM_STATE_BUCKET != '' &&
          vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' &&
          vars.GCP_DEPLOYMENT_SERVICE_ACCOUNT != '' &&
          vars.GCP_DEVELOPMENT_PROJECT_ID != '' &&
          vars.GCP_REGION != '' &&
          vars.KRATOS_DOMAIN_NAME != '' }}
    runs-on: ubuntu-latest
    environment: development

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYMENT_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5

      - name: Apply platform infrastructure
        working-directory: infrastructure/platform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.GCP_TERRAFORM_STATE_BUCKET }}" \
            -backend-config="prefix=development/platform"
          terraform apply -auto-approve \
            -var="project_id=${{ vars.GCP_DEVELOPMENT_PROJECT_ID }}" \
            -var="region=${{ vars.GCP_REGION }}"

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and publish application
        id: image
        shell: bash
        run: |
          image="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_DEVELOPMENT_PROJECT_ID }}/kratos/control-plane:${GITHUB_SHA}"
          docker build --file services/control-plane/Dockerfile --tag "$image" .
          docker push "$image"
          echo "reference=$image" >> "$GITHUB_OUTPUT"

      - name: Read runtime identity
        id: platform
        working-directory: infrastructure/platform
        shell: bash
        run: |
          database_enabled="$(terraform output -raw database_enabled)"
          echo "runtime_service_account=$(terraform output -raw runtime_service_account)" >> "$GITHUB_OUTPUT"
          echo "migration_service_account=$(terraform output -raw migration_service_account)" >> "$GITHUB_OUTPUT"
          echo "database_enabled=$database_enabled" >> "$GITHUB_OUTPUT"
          if [[ "$database_enabled" == "true" ]]; then
            echo "database_connection_name=$(terraform output -raw database_connection_name)" >> "$GITHUB_OUTPUT"
            echo "database_iam_username=$(terraform output -raw database_iam_username)" >> "$GITHUB_OUTPUT"
            echo "migration_database_iam_username=$(terraform output -raw migration_database_iam_username)" >> "$GITHUB_OUTPUT"
          else
            echo "database_connection_name=" >> "$GITHUB_OUTPUT"
            echo "database_iam_username=" >> "$GITHUB_OUTPUT"
            echo "migration_database_iam_username=" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply database migration job
        working-directory: infrastructure/migration
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.GCP_TERRAFORM_STATE_BUCKET }}" \
            -backend-config="prefix=development/migration"
          terraform apply -auto-approve \
            -var="project_id=${{ vars.GCP_DEVELOPMENT_PROJECT_ID }}" \
            -var="region=${{ vars.GCP_REGION }}" \
            -var="database_enabled=${{ steps.platform.outputs.database_enabled }}" \
            -var="container_image=${{ steps.image.outputs.reference }}" \
            -var="migration_service_account=${{ steps.platform.outputs.migration_service_account }}" \
            -var="database_connection_name=${{ steps.platform.outputs.database_connection_name }}" \
            -var="migration_database_iam_username=${{ steps.platform.outputs.migration_database_iam_username }}" \
            -var="application_database_iam_username=${{ steps.platform.outputs.database_iam_username }}"

      - name: Run database migrations
        if: ${{ steps.platform.outputs.database_enabled == 'true' }}
        run: >-
          gcloud run jobs execute kratos-database-migration
          --project=${{ vars.GCP_DEVELOPMENT_PROJECT_ID }}
          --region=${{ vars.GCP_REGION }}
          --wait

      - name: Apply application infrastructure
        working-directory: infrastructure/application
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.GCP_TERRAFORM_STATE_BUCKET }}" \
            -backend-config="prefix=development/application"
          terraform apply -auto-approve \
            -var="project_id=${{ vars.GCP_DEVELOPMENT_PROJECT_ID }}" \
            -var="region=${{ vars.GCP_REGION }}" \
            -var="container_image=${{ steps.image.outputs.reference }}" \
            -var="runtime_service_account=${{ steps.platform.outputs.runtime_service_account }}" \
            -var="domain_name=${{ vars.KRATOS_DOMAIN_NAME }}" \
            -var="identity_platform_api_key=${{ vars.KRATOS_IDENTITY_PLATFORM_API_KEY }}" \
            -var="bootstrap_operator_email=${{ vars.KRATOS_BOOTSTRAP_OPERATOR_EMAIL }}" \
            -var="database_enabled=${{ steps.platform.outputs.database_enabled }}" \
            -var="database_connection_name=${{ steps.platform.outputs.database_connection_name }}" \
            -var="database_iam_username=${{ steps.platform.outputs.database_iam_username }}"

      - name: Report deployment addresses
        working-directory: infrastructure/application
        run: |
          terraform output public_url
          terraform output required_dns_record
