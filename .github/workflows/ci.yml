name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:typecheck
      - run: pnpm web:build

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.19"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest

  gpu-health-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/gpu-health-check
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.19"
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - run: uv run --python 3.12 ruff format --check .
      - run: uv run --python 3.12 ruff check .
      - run: uv run --python 3.12 mypy health_check.py

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
      - run: terraform fmt -check -recursive infrastructure
      - run: terraform -chdir=infrastructure/bootstrap init -backend=false -input=false
      - run: terraform -chdir=infrastructure/bootstrap validate
      - run: terraform -chdir=infrastructure/platform init -backend=false -input=false
      - run: terraform -chdir=infrastructure/platform validate
      - run: terraform -chdir=infrastructure/application init -backend=false -input=false
      - run: terraform -chdir=infrastructure/application validate

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/control-plane/Dockerfile
          push: false
          tags: kratos-control-plane:ci
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: workers/agent/Dockerfile
          push: false
          tags: kratos-agent:ci
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: workers/gpu-health-check/Dockerfile
          push: false
          tags: kratos-gpu-health-check:ci
