services:
  workspace:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    environment:
      DATABASE_URL: postgresql://kratos@postgres:5432/kratos
      RUST_LOG: kratos_control_plane=debug
      KRATOS_GRAFANA_URL: http://127.0.0.1:13000
      KRATOS_MLFLOW_URL: http://127.0.0.1:15000
    volumes:
      - ..:/workspaces/kratos:cached
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - cargo-target:/workspaces/kratos/target
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: kratos
      POSTGRES_USER: kratos
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kratos -d kratos"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  cargo-registry:
  cargo-git:
  cargo-target:
  postgres-data:
